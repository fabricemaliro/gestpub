{% include "nav.html" %}
{% block content %}
<!-- Right side column. Contains the navbar and content of the page -->
<aside class="right-side">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            Gestion des ouvrages
            <small>Liste des livres</small>
        </h1>
        <ol class="breadcrumb">
            <li><a href="#"><i class="fa fa-dashboard"></i> Home</a></li>
            <li><a href="#">Tables</a></li>
            <li class="active">Data tables</li>
        </ol>
    </section>

    <!-- Main content -->
    <section class="content">
        <div class="row">
            <div class="col-xs-12">

                <div class="box">
                    <div class="box-header">
                        <h3 class="box-title"></h3>
                    </div><!-- /.box-header -->
                    <label class="input input-bordered flex col-sm-6">
                        <input type="search" class="form-control md-4" placeholder="Search" name="mot_cle"
                            hx-get="{% url 'rechercher_livre' %}" hx-trigger="keyup delay:1s" hx-target="#example1"
                            hx-indicator="#transition"
                            hx-on::before-request="document.getElementById('example1').style.opacity=0.4;"
                            hx-on::after-request="document.getElementById('example1').style.opacity=1.0;" />
                    </label>
                    <div class="box-body table-responsive">
                        {% include "tableau_livre.html" %}
                    </div><!-- /.box-body -->
                </div><!-- /.box -->
            </div>
        </div>

    </section><!-- /.content -->
</aside><!-- /.right-side -->

<script type="text/javascript">
    $(function () {
        $('#example2').dataTable({
            "bPaginate": true,
            "bLengthChange": false,
            "bFilter": false,
            "bSort": true,
            "bInfo": true,
            "bAutoWidth": false
        });
    });
</script>
{% endblock %}
